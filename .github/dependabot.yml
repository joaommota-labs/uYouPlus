version: 2
# Baseline from joaommota-labs/project-bootstrap: one grouped PR per
# ecosystem per week.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # version updates come from Renovate
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
